<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/bootstrap.min.js" defer></script>
    <title>Atividade de bootstrap</title>
</head>

<body class="bg-light">
    <main class="container my-5">
        <div class="row">
        <section class="container my-5 p-4 shadow-sm bg-white rounded border">

            <h2 class="mb-4 fw-bold"> Inscreva-se em nossa <br>newsletter</h2>
            <form class="row g-3 needs-validation">
                <div class="col-md-7">
                    <label for="none" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="nome" placeholder="Digite aqui seu nome">
                    <div class="valid-feedback">Bom</div>
                    <div class="invalid-feedback">Por favor, insira seu nome</div>
                </div>

                <div class="col-md-7">
                    <label for="none" class="form-label">Email</label>
                    <input type="text" class="form-control" id="email" placeholder="Digite neste campo seu email">
                    <div class="valid-feedback">Bom</div>
                    <div class="invalid-feedback">Por favor, insira seu e-mail</div>
                </div>

                <div class="col-md-7">
                    <label for="none" class="form-label">CPF</label>
                    <input type="text" class="form-control" id="cpf" placeholder="Digite seu CPF">
                    <div class="valid-feedback">Bom</div>
                    <div class="invalid-feedback">Por favor, insira seu cpf</div>
                </div>

                <div class="col-md-7">
                    <label for="none" class="form-label">Data de Nascimento</label>
                    <input type="date" class="form-select" id="nascimento">
                    <div class="invalid-feedback">Informe sua idade</div>
                    <div class="valid-feedback">Bom</div>
                </div>

                <div class="col-md-7 d-flex align-items-end">
                    <button class="btn w-100 text-white" style="background: linear-gradient(90deg,#8300c0);">
                        Inscreva-se
                    </button>
                </div>
            </form>
        </section>

        <section class="container my-5 p-4 shadow-sm bg-white rounded border">
            <h2 class="mb-4 fw-bold"> Inscreva-se em nossa <br>newsletter</h2>
            <div class="col-md-7">
                <label for="none" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" placeholder="Digite aqui seu nome">
                <div class="valid-feedback">Bom</div>
                <div class="invalid-feedback">Por favor, insira seu nome</div>
            </div>
            <div class="col-md-7">
                <label for="none" class="form-label">Email</label>
                <input type="text" class="form-control" id="email" placeholder="Digite seu email">
                <div class="valid-feedback">Bom</div>
                <div class="invalid-feedback">Por favor, insira seu email</div>
            </div>
            <div class="col-md-7 d-flex align-items-end">
                <button class="btn w-100 text-white" style="background: linear-gradient(90deg,#8300c0);">
                    Inscreva-se
                </button>
            </div>
        </section>
        </div>
    </main>
</body>
