<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/bootstrap.min.js" defer></script>
    <title>Aula Bootstrap</title>
</head>
<body class="bg-light">
 
<section class="container my-5 p-4 shadow-sm bg-white rounded border">
   
    <h2 class="mb-4 fw-bold text-primary">Cadastro de Aluno</h2>
 
    <form class="row g-3 needs-validation" novalidate>
 
        <div class="col-md-8">
            <label for="nome" class="form-label">Nome Completo</label>
            <input type="text" class="form-control" id="nome" placeholder="Digite seu nome" required>
            <div class="valid-feedback">Parece bom!</div>
            <div class="invalid-feedback">Por favor digite seu nome completo.</div>
        </div>
 
        <div class="col-md-4">
            <label for="Nascimento" class="form-label">Data de Nascimento</label>
            <input type="date" id="Nascimento" required class="form-control">
        </div>
 
        <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <div class="input-group">
                <span class="input-group-text">@</span>
                <input type="email" id="email" class="form-control" placeholder="usuario@senac.edu.br" required>
            </div>
        </div>
 
       
 
        <div class="col-md-12">
            <label for="curso" class="form-label">Curso Técnico</label>
            <select id="curso" class="form-select" required>
                <option selected disabled value="">Escolha o curso...</option>
                <option value="393">Técnico em Informática</option>
                <option value="451">Técnico em Análise e Desenvolvimento de Sistemas</option>
                <option value="793">Técnico em Redes de Computadores</option>
                <option value="426">Técnico em Enfermagem</option>
            </select>
            <div class="invalid-feedback">Selecione uma opção válida!</div>
        </div>
 
 
        <div class="col-12">
            <label for="obs" class="form-label">Observações</label>
            <textarea id="obs" rows="3" class="form-control" placeholder="Conte-nos sobre sua experiência..."></textarea>
        </div>
 
        <div class="col-12">
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="termos" required>
                <label for="termos" class="form-check-label">
                    Concordo com as políticas da instituição
                </label>
            </div>
        </div>
 
        <div class="col-12 mt-4">
            <button type="submit" class="btn btn-primary px-4">Finalizar Matrícula</button>
            <button type="reset" class="btn btn-outline-secondary px-4">Limpar</button>
        </div>
        <div class="col-md-6">
            <label for="telefone" class="form-label">Telefone / WhatsApp</label>
            <input type="tel" class="form-control" id="telefone" placeholder="(11) 99999-9999" required>
            <div class="invalid-feedback">Informe um telefone válido.</div>
        </div>
        <div class="col-md-12">
            <label class="form-label d-block">Gênero</label>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="genero" id="masculino" value="M" required>
                <label class="form-check-label" for="masculino">Masculino</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="genero" id="feminino" value="F">
                <label class="form-check-label" for="feminino">Feminino</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="genero" id="outro" value="O">
                <label class="form-check-label" for="outro">Outro / Prefiro não dizer</label>
            </div>
        </div>
 
    </form>
</section>
 
<script>
    (() => {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>
 
</body>
</html>
